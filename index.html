<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyLybrary</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <header class="cabecalho">
      <div class="perfil">
        <span
          class="material-symbols-outlined PerfilEdit"
          onclick="abrirLogoutModal()"
          >account_circle</span
        >
        <h1>Minha Estante</h1>
        <div id="contador-livros">0 Livros</div>
      </div>
      <div class="botoes-cabecalho">
        <input
          type="text"
          id="Buscar"
          placeholder="Procurar por obra..."
          oninput="filtrarLivros()"
        />
        <button id="adicionar-btn" type="button" onclick="abrirModal()">
          Adicionar Livro
        </button>
        <button
          id="adicionarManual-btn"
          type="button"
          onclick="abrirModalManual()"
        >
          Adicionar Livro Manual
        </button>
      </div>
    </header>

    <div id="livros-container"></div>
    <div id="livro-preview" style="display: none"></div>

    <div class="logo-container">
      <img src="img/logo.png" alt="logo" class="logo" />
    </div>

    <div class="filters">
      <button id="alternar-visualizacao">
        <span class="material-symbols-outlined" id="icone-visualizacao"
          >dehaze</span
        >
      </button>
      <button id="sortByName">
        <span class="material-symbols-outlined"> sort_by_alpha </span>
      </button>
      <button id="removeFilters">
        <span class="material-symbols-outlined"> filter_none </span>
      </button>
    </div>

    <div id="modalManual" class="modalManual">
      <div class="modal-content">
        <input
          id="tituloInput"
          type="text"
          placeholder="Titulo da obra..."
          required
        />
        <input
          type="file"
          id="capaManual"
          name="capaManual"
          accept="image/*"
          required
        />
        <input id="autorInput" type="text" placeholder="Nome do Autor..." />
        <input id="codigoInput" type="number" placeholder="Código ISBN..." />
        <input id="editoraInput" type="text" placeholder="Editora..." />
        <input id="serieInput" type="text" placeholder="Série..." />
        <input id="volumeInput" type="text" placeholder="Volume..." />
        <input
          id="paginasInput"
          type="number"
          placeholder="Quantas páginas..."
        />
        <input id="sinopseInput" type="text" placeholder="Sinopse..." />
        <input id="dataInput" type="date" />
        <div class="botoesModal">
          <button onclick="adicionarLivroManual()">Adicionar</button>
          <button onclick="fecharModalManual()">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <h2>Adicionar Livro</h2>
        <input
          type="text"
          id="tituloBuscaInput"
          placeholder="Título do livro"
        />
        <input type="text" id="autorBuscaInput" placeholder="Autor" />
        <button type="button" onclick="buscarELivro()">
          Buscar e Adicionar
        </button>
        <button type="button" onclick="fecharModal()">Cancelar</button>
      </div>
    </div>

    <modal id="modalLogout" class="modalLogout">
      <div class="modal-content">
        <h2>Deseja sair?</h2>
        <div class="btnOption">
          <button onclick="deslogarUsuario()">Sim</button>
          <button onclick="fecharModalLogout()">Não</button>
        </div>
      </div>
    </modal>

    <script src="js/app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  </body>
</html>
